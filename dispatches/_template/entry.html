<!-- ==========================================================================
     INDEX ROW — one PublicIndexEntry.
     The generated form of dispatches/index.html wraps every row in
     <ol class="dispatch-list" role="list" data-dispatch-list> ... </ol> and splices that
     list between the dispatch-entries markers, replacing the empty state.
     data-saber is "green", "blue", or omitted when the member carries neither.
     {{THUMB}} is the thumb fragment for a piece that has a photograph on the
     site, and the empty string for one that has not. The filing column holds
     it: a row without a picture is then exactly as tall and exactly as wide as
     it always was, and no row's headline moves because a neighbour has one.
     ========================================================================== -->
<li class="dispatch-entry" data-beat="{{BEAT}}" data-section="{{SECTION}}" data-saber="{{SABER}}">
  <a class="dispatch-entry-link" href="{{SLUG}}/">
    <div class="dispatch-entry-file">
      <p class="dispatch-index"><b>{{ORDINAL}}</b> <span>{{SECTION}}</span></p>
      {{THUMB}}
    </div>
    <div class="dispatch-entry-copy">
      <h3 class="dispatch-entry-headline">{{HEADLINE}}</h3>
      <p class="dispatch-entry-standfirst">{{STANDFIRST}}</p>
    </div>
    <p class="dispatch-entry-meta">
      <span class="dispatch-entry-name">{{BYLINE_NAME}}</span>
      <span class="dispatch-entry-title">{{BYLINE_TITLE}}</span>
      <time datetime="{{DATE}}">Day {{DAY}} &middot; {{PHASE}}</time>
    </p>
  </a>
</li>
